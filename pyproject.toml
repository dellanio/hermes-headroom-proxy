[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-headroom-proxy"
version = "0.3.0"
authors = [{name = "Dellanio Alencar", email = "contato@dellanio.com"}]
description = "Headroom lifecycle and explicit routing integration for Hermes"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/dellanio/hermes-headroom-proxy"
Issues = "https://github.com/dellanio/hermes-headroom-proxy/issues"

[project.scripts]
hermes-headroom-proxy = "headroom_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["headroom_proxy*"]

[tool.setuptools.package-data]
headroom_proxy = ["plugin.yaml"]
